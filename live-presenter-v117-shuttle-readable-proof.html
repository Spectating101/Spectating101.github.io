const q='Space Shuttle Discovery underside nose thermal protection tiles';const D=['diagram','schematic','labelled','labeled','apparatus','drawing','illustration','cross-section','cross section','svg'];const txt=v=>String(v||'').replace(/<[^>]*>/g,' ').replace(/_/g,' ').replace(/\s+/g,' ').trim();const toks=v=>new Set((txt(v).toLowerCase().match(/[a-z0-9]+/g)||[]).filter(x=>x.length>2));const kind=x=>D.some(c=>[x.title,x.description,x.mime,x.url].map(txt).join(' ').toLowerCase().includes(c))?'diagram':'photo';function score(x){if(!String(x.mime||'').startsWith('image/'))return-1e9;let n=0,qt=toks(q),ht=toks(txt(x.title)+' '+txt(x.description));qt.forEach(t=>{if(ht.has(t))n++});let s=n*2+(kind(x)==='photo'?4:0);const desc=(txt(x.title)+' '+txt(x.description)).toLowerCase();if(/discovery/.test(desc))s+=2;if(/underside|nosecone|nose cone|thermal protection|tiles/.test(desc))s+=2;if(/infrared|thermal map|false.color/.test(desc))s-=2;if(/public domain|cc0|pd-usgov/.test(txt(x.license).toLowerCase()))s+=1;if(Math.min(+x.width||0,+x.height||0)>=500)s+=.5;return s}const esc=s=>txt(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));(async()=>{const t0=performance.now(),p=new URLSearchParams({action:'query',generator:'search',gsrsearch:q,gsrnamespace:'6',gsrlimit:'12',prop:'imageinfo',iiprop:'url|mime|size|extmetadata',iiurlwidth:'1280',format:'json',origin:'*'});const raw=await(await fetch('https://commons.wikimedia.org/w/api.php?'+p)).json(),ts=performance.now();let xs=Object.values(raw?.query?.pages||{}).map(pg=>{const i=(pg.imageinfo||[{}])[0],m=i.extmetadata||{};return{title:pg.title,url:i.thumburl||i.url,mime:i.mime,width:i.thumbwidth||i.width,height:i.thumbheight||i.height,description:m.ImageDescription?.value||'',license:m.LicenseShortName?.value||''}}).filter(x=>String(x.mime).startsWith('image/'));xs.forEach(x=>x.score=score(x));xs.sort((a,b)=>b.score-a.score||b.width*b.height-a.width*a.height);const x=xs[0],ti=performance.now(),im=new Image();im.src=x.url;await new Promise((a,b)=>{im.onload=a;im.onerror=b});const tr=performance.now();document.getElementById('m').innerHTML=`<span><b>${Math.round(ts-t0)} ms</b> search</span><span><b>${Math.round(tr-ti)} ms</b> image bytes</span><span><b>${Math.round(tr-t0)} ms</b> total</span><span><b>${x.width}×${x.height}</b></span><span><b>contain</b></span>`;document.getElementById('s').innerHTML=`<div class="k">Orbiter structure · retrieved illustration</div><div class="h">Thermal protection has to survive reentry</div><div class="f"><img src="${esc(x.url)}"><div class="c">${esc(x.title)} · ${esc(x.license)}</div></div>`;document.getElementById('r').innerHTML='<b>Ranking:</b> '+xs.slice(0,5).map((z,i)=>`${i+1}. ${esc(z.title)} (${z.score.toFixed(1)})`).join(' · ');window.__LP_PROOF={search_ms:Math.round(ts-t0),image_ms:Math.round(tr-ti),total_ms:Math.round(tr-t0),selected:x.title,ranking:xs.slice(0,5).map(z=>z.title)};document.title='READY · Shuttle readable proof'})().catch(e=>{document.getElementById('s').textContent='FAILED '+e;document.title='FAILED'});</script>
